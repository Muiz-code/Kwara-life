<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwara Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E6D6B8; --panel:#FBF4E6; --panel-2:#F1E4CB; --ink:#1F2A4D; --ink-soft:#5E6582; --line:#D8C49E;
  --indigo:#26355E; --laterite:#B5532E; --keke:#F2B705; --leaf:#3F6B3A; --danger:#B3261E; --ok:#2F7D5B; --up:#2F7D5B;
  --sign:"Lilita One","Arial Black",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#111830; --panel:#1B2443; --panel-2:#232E55; --ink:#F1E8D4; --ink-soft:#A9AFC7; --line:#33406B; --indigo:#0F1730; --up:#7FD3A8; --leaf:#8BC57A; }
}
:root[data-theme="dark"]{ --page:#111830; --panel:#1B2443; --panel-2:#232E55; --ink:#F1E8D4; --ink-soft:#A9AFC7; --line:#33406B; --indigo:#0F1730; --up:#7FD3A8; --leaf:#8BC57A; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.loc:focus-visible{outline:3px solid var(--keke);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;max-width:1360px;margin:0 auto;padding:16px}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--sign);font-size:28px;line-height:1;background:var(--indigo);color:#F7E7C1;padding:8px 14px 9px;border-radius:6px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--laterite);letter-spacing:.5px}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700}
.me svg{width:34px;height:34px;border-radius:50%;background:#E9D5AE;display:block}
.hud .spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap}
.pill small{font-weight:500;color:var(--ink-soft)}
.pill.money{color:var(--leaf)}
.pill.nepa{background:#3B2A1A;color:#FFD66B;border-color:#3B2A1A}
.btn{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink-soft)}

.map{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--indigo);background:#D9BF8C;box-shadow:0 10px 0 -4px rgba(38,53,94,.25)}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.loc{cursor:pointer}
.loc:hover .signbg{fill:#3A4C80}
.sel-ring{fill:none;stroke:var(--keke);stroke-width:4;stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.walking .leg-a{animation:legA .32s ease-in-out infinite alternate}
.walking .leg-b{animation:legB .32s ease-in-out infinite alternate}
.walking .arm-a{animation:legB .32s ease-in-out infinite alternate}
.walking .arm-b{animation:legA .32s ease-in-out infinite alternate}
.leg-a,.leg-b,.arm-a,.arm-b{transform-box:fill-box;transform-origin:50% 0}
@keyframes legA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes legB{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
.cloud{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1220px)}}
@media (prefers-reduced-motion: reduce){.sel-ring,.cloud,.walking .leg-a,.walking .leg-b,.walking .arm-a,.walking .arm-b{animation:none}}

.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-family:var(--sign);font-weight:400;font-size:20px;margin:0 0 8px;line-height:1.1}
.muted{color:var(--ink-soft)}

.need{display:grid;grid-template-columns:72px 1fr 36px;align-items:center;gap:10px;margin:7px 0}
.need span{font-weight:600;font-size:14px}
.need b{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.track{height:14px;border-radius:4px;background:var(--panel-2);overflow:hidden;border:1.5px solid var(--line)}
.fill{height:100%;transition:width .4s ease}
.need.low .track{border-color:var(--danger)}
.need.low b{color:var(--danger)}
.f-food{background:repeating-linear-gradient(90deg,#B5532E 0 8px,#E0884F 8px 11px,#7A2E1B 11px 14px)}
.f-energy{background:repeating-linear-gradient(90deg,#E0A800 0 8px,#F7D35C 8px 11px,#9A6B00 11px 14px)}
.f-fun{background:repeating-linear-gradient(90deg,#8C2F5A 0 8px,#C2578A 8px 11px,#5A1838 11px 14px)}
.f-social{background:repeating-linear-gradient(90deg,#26355E 0 8px,#4F6AAE 8px 11px,#121B36 11px 14px)}
.f-hygiene{background:repeating-linear-gradient(90deg,#2F7D7A 0 8px,#5FB3AE 8px 11px,#1A4C4A 11px 14px)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--panel-2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}

.place-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.open{font-size:12.5px;font-weight:600;white-space:nowrap}
.open.no{color:var(--danger)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.act{display:block;width:100%;text-align:left;background:var(--panel-2);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer}
.act:hover:not(:disabled){border-color:var(--indigo)}
.act:disabled{opacity:.55;cursor:not-allowed}
.act-name{font-weight:700;display:block}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;font-weight:600;background:var(--panel);border-radius:6px;padding:1px 7px;color:var(--ink-soft)}
.chip.cost{color:var(--danger)}
.chip.earn,.chip.up{color:var(--up)}
.why{display:block;font-size:12.5px;color:var(--danger);margin-top:4px;font-weight:600}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gobtn{border:none;border-radius:10px;padding:12px;cursor:pointer;font-weight:700;text-align:left}
.gobtn small{display:block;font-weight:500;opacity:.85}
.gobtn.keke{background:var(--keke);color:#2A2000}
.gobtn.walk{background:#26355E;color:#F7E7C1}
.gobtn:disabled{opacity:.5;cursor:not-allowed}
.preview{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.preview li{font-size:12.5px;background:var(--panel-2);border-radius:6px;padding:2px 8px}

.friend{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.friend:last-child{border-bottom:none}
.friend b{display:block}
.friend small{color:var(--ink-soft)}
.hearts{color:#C2578A;letter-spacing:1px;font-size:14px;white-space:nowrap}
.hearts i{font-style:normal;color:var(--line)}

.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:none}
.log time{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.foot{display:flex;justify-content:flex-end}

.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;overflow:auto}
.overlay.on{display:flex}
.modal{background:var(--panel);color:var(--ink);border-radius:16px;max-width:440px;width:100%;padding:20px;border:3px solid #26355E;box-shadow:6px 6px 0 var(--laterite)}
.modal h3{font-family:var(--sign);font-weight:400;font-size:24px;margin:0 0 8px;line-height:1.1}
.modal p{margin:0 0 16px}
.modal .choices{display:flex;flex-direction:column;gap:8px}
.modal .choices button{border:none;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--panel-2);text-align:left}
.modal .choices button:first-child{background:#26355E;color:#F7E7C1}

.creator{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:start}
.creator .stage{background:linear-gradient(#F3E4C4,#E2C893);border-radius:12px;display:flex;justify-content:center;padding:8px 0;border:2px solid #26355E}
.creator .stage svg{width:110px;height:160px}
.field{margin-bottom:12px}
.field label,.field .lbl{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.field input{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:#26355E;color:#F7E7C1;border-color:#26355E}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--keke);outline-offset:2px}
.startbtn{width:100%;border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;background:var(--keke);color:#2A2000;margin-top:4px}
@media (max-width:520px){.creator{grid-template-columns:1fr}.creator .stage svg{height:140px}}

.scenebar{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px}
.scenebar .btn{background:#26355E;color:#F7E7C1;border-color:#26355E}
.scenetitle{font-family:var(--sign);font-size:20px;color:#F7E7C1;background:rgba(38,53,94,.85);padding:4px 12px;border-radius:8px}
.prop{cursor:pointer}.prop:hover .tag rect{fill:#3A4C80}.prop:focus-visible{outline:3px solid var(--keke)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#26355E;color:#F7E7C1;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .app{grid-template-columns:1fr;padding:10px;gap:10px}
  .brand{font-size:22px}
  .map{border-radius:12px}
}

.map{aspect-ratio:10/7;touch-action:none}
.map svg{width:100%;height:100%;cursor:grab}
.map svg:active{cursor:grabbing}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:40px;height:40px;border-radius:10px;border:2px solid #26355E;background:#FBF4E6;color:#26355E;font-weight:800;font-size:18px;cursor:pointer}
.zoombar button.me-btn{font-size:12px}
.go.one{grid-template-columns:1fr}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mode{border:none;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:700}
.mode small{display:block;font-weight:500;font-size:12.5px;opacity:.9}
.mode .mnote{opacity:.75;font-size:11.5px}
.mode:disabled{opacity:.45;cursor:not-allowed}
.m-walk{background:#26355E;color:#F7E7C1}.m-keke{background:#F2B705;color:#2A2000}.m-okada{background:#B3261E;color:#fff}.m-bus{background:#2F7D5B;color:#fff}.m-horse{background:#8C2F5A;color:#fff;grid-column:1/-1}
.goals{list-style:none;margin:0;padding:0;font-size:14px}
.goals li{padding:5px 0;border-bottom:1px solid var(--line)}.goals li:last-child{border-bottom:none}
.goals li.done{color:var(--up);font-weight:700}
.scenebar{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px}
.scenebar .btn{background:#26355E;color:#F7E7C1;border-color:#26355E}
.scenetitle{font-family:var(--sign);font-size:20px;color:#F7E7C1;background:rgba(38,53,94,.85);padding:4px 12px;border-radius:8px}
.prop{cursor:pointer}.prop:hover .tag rect{fill:#3A4C80}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="hud">
      <div class="brand">Kwara Life</div>
      <div class="me" id="me" role="button" tabindex="0" aria-label="Edit your character"></div>
      <div class="spacer"></div>
      <div class="pill" id="clock"></div>
      <div class="pill money" id="money"></div>
      <div class="pill" id="mood"></div>
      <div class="pill nepa" id="nepa" hidden>No light</div>
      <button class="btn" id="pause">Pause</button>
    </div>
    <div class="map">
      <svg id="map" role="img" aria-label="Map of Ilorin"></svg>
      <svg id="scene" viewBox="0 0 1000 700" role="img" aria-label="Inside view" style="display:none"></svg>
      <div class="zoombar" id="zoombar"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zme" class="me-btn" aria-label="Find me">Me</button></div>
      <div class="scenebar" id="scenebar" hidden><button class="btn" id="exitbtn">Back to map</button><span class="scenetitle" id="scenetitle"></span></div>
    </div>
  </div>
  <div class="side">
    <section class="card" aria-label="Needs"><h2>How you dey</h2><div id="needs"></div><div class="stats" id="stats"></div></section>
    <section class="card" id="place" aria-live="polite"></section>
    <section class="card"><h2>Goals</h2><ul class="goals" id="goals"></ul></section>
    <section class="card"><h2>Friends</h2><div id="friends"></div></section>
    <section class="card"><h2>Journal</h2><ul class="log" id="log"></ul></section>
    <div class="foot"><button class="btn" id="reset">Start a new life</button></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt"></h3><div id="mbody"></div></div></div>
<div class="toast" id="toast"></div>

  if(ptrs.size===1){const dx=cur.x-prev.x,dy=cur.y-prev.y;if(Math.abs(dx)+Math.abs(dy)>0){const k=cam.w/svg.clientWidth;cam.x-=dx*k;cam.y-=dy*k;applyCam();}if(Math.abs(cur.x-down0(e).x)+Math.abs(cur.y-down0(e).y)>6){dragged=true;follow=false}}
  else if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.w=pinch0.w*pinch0.d/d;applyCam();dragged=true}});

  else if(S.n.energy<=0){advance(240,{sleep:true});S.n.energy=45;note("You slept off","You were so tired you slept off at "+LOC[S.loc].name+" for 4 hours.");log("Slept off at "+LOC[S.loc].name+".")}}
function befriend(id){const f=FRIENDS[id],d=dayNum();if(S.frDay[id]===d)return f.name+" is happy to see you again today.";S.frDay[id]=d;if(S.fr[id]<5)S.fr[id]++;let m=pick(f.lines);if(S.fr[id]===3&&f.unlock)m+=" "+f.unlock;if(S.fr[id]===5)m+=" You are now close friends.";return m}
function reason(a){const L=LOC[S.loc],h=hour(),d=dow();
  if(a.home&&S.homeId!==S.loc)return S.loc==="home"?"You moved out of this place":"You don't live here yet";
  if(a.rent&&S.homeId===S.loc)return "You already live here";
  if(!isOpen(L,h))return L.name+" is closed now";
  if(a.hours&&!(h>=a.hours[0]&&h<a.hours[1]))return "Only from "+fmtH(a.hours[0])+" to "+fmtH(a.hours[1]);
  if(a.day!==undefined&&d!==a.day)return "Only on "+["Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays","Sundays"][a.day];
  if(a.days&&!a.days.includes(d))return "Only on weekends";
  if(a.weekdays&&d>4)return "Offices are closed on weekends";
  if(a.noDay!==undefined&&d===a.noDay)return "Closed on Sundays";
  if(a.once&&S.flags[a.once])return "Already done. Wait for their call";
  if(a.job&&!S.flags.job)return S.flags.applied?"Wait for the Ministry to call you":"Submit your CV first";
  if(a.job&&S.flags.worked===dayNum())return "You already worked today";
  if(a.horse&&horseToday())return "You already have a horse today";
  if(a.goal&&S.goals[a.goal])return "Already done";
  if(a.light&&!S.light&&!L.gen)return "NEPA took light";
  if(a.usesFood&&S.groceries<=0)return "No foodstuff at home. Buy some at Oja Oba, Oke-Odo or Palms Mall";
  if(a.minSkill&&S.skill<a.minSkill)return "Needs skill "+a.minSkill+". Learn at the Innovation Hub or KWASU library";
  if(cost(a)>S.money)return "Not enough money";
  return null}
function runClock(dur,opt){return new Promise(res=>{const ms=Math.min(1800,500+dur*2.2),t0=performance.now();let done=0;
  function f(now){const p=Math.min(1,(now-t0)/ms);const target=Math.round(dur*p);if(target>done){advance(target-done,opt);done=target;renderHud()}if(p<1)requestAnimationFrame(f);else res()}requestAnimationFrame(f)})}
async function doAction(a){
  if(busy)return;const why=reason(a);if(why){toast(why);return}
  busy=true;renderPanel(true);let dur=a.dur,pre="";
  if(a.water&&Math.random()<.3){dur+=30;S.n.energy=clamp(S.n.energy-6);pre="Tap no run, so you fetched water from the well first. "}
  bubble(a.bubble||a.label);const c=cost(a);
  if(a.goal==="fly"){$("avatar").style.opacity="0"}
  await runClock(dur,{sleep:!!a.sleep});$("avatar").style.opacity="1";
  S.money-=c;if(a.earn)S.money+=a.earn;if(a.tip)S.money+=a.tip;
  apply(a.fx);if(a.groc)S.groceries+=a.groc;if(a.usesFood)S.groceries--;if(a.skill)S.skill=Math.round((S.skill+a.skill)*10)/10;
  if(a.once)S.flags[a.once]=S.t;if(a.job)S.flags.worked=dayNum();if(a.horse)S.horseDay=dayNum();
  if(a.rent){S.homeId=S.loc;note("New home",`Welcome to ${LOC[S.loc].name}. This is now where you sleep, bath and cook.`)}
  if(a.goal&&!S.goals[a.goal]){S.goals[a.goal]=1;note("Goal reached",a.done)}
  let msg=pre+a.done;if(a.friend)msg+=" "+befriend(a.friend);if(a.earn)msg+=" You earned "+naira(a.earn)+".";
  log(msg);toast(a.earn?"+"+naira(a.earn):a.done);bubble(null);busy=false;checkCritical();save();render();flush()}

/* ================= TRAVEL ================= */
function shortest(from,to){const dist={},prev={},Q=new Set(nodes.map(n=>n.id));Q.forEach(n=>dist[n]=Infinity);dist[from]=0;
  while(Q.size){let u=null;Q.forEach(n=>{if(u===null||dist[n]<dist[u])u=n});Q.delete(u);if(u===to||dist[u]===Infinity)break;
    (ADJ[u]||[]).forEach(v=>{if(!Q.has(v))return;const p=np(u),q=np(v);const alt=dist[u]+Math.hypot(q.x-p.x,q.y-p.y);if(alt<dist[v]){dist[v]=alt;prev[v]=u}})}
  const path=[];let c=to;while(c){path.unshift(c);c=prev[c]}return path}
function route(dest){const ids=shortest(S.loc,dest);const pts=[standPos(S.loc)];ids.forEach(id=>pts.push(np(id)));pts.push(standPos(dest));return{pts,ids}}
function routeLen(p){let d=0;for(let i=1;i<p.length;i++)d+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return d}
const MODES={
  walk:{label:"Walk",min:d=>Math.round(d/7),fare:()=>0,note:"Free, but tiring"},
  keke:{label:"Keke",min:d=>Math.round(4+d/30),fare:d=>100+Math.round(d/150)*50,note:"The normal way"},
  okada:{label:"Okada",min:d=>Math.round(3+d/42),fare:d=>Math.max(100,Math.round((100+Math.round(d/150)*50)*.75/50)*50),note:"Fast and cheap, small wahala risk"},
  bus:{label:"Korope bus",min:d=>Math.round(12+d/30),fare:d=>150+Math.round(d/300)*50,note:"Cheapest, waits at stops"},
  horse:{label:"Durbar horse",min:d=>Math.round(d/11),fare:()=>0,note:"Slow, but everyone waves"}
};
function tripInfo(dest){const r=route(dest),d=routeLen(r.pts);const hw=r.ids.some((id,i)=>i&&HW[r.ids[i-1]+"|"+id]);const o={d,hw};Object.keys(MODES).forEach(k=>o[k]={min:MODES[k].min(d),fare:MODES[k].fare(d)});return o}
function modeBlock(k,t){if(k==="walk"&&t.d>1300)return "Too far to walk";if(k==="horse"&&!horseToday())return "Hire a horse at the Emir's Palace";if(k==="okada"&&t.hw)return "Okadas don't do the Malete road";if(t[k].fare>S.money)return "Not enough money";return null}
function at(p,f){const total=routeLen(p);let target=total*f;for(let i=1;i<p.length;i++){const seg=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);if(target<=seg){const k=seg?target/seg:0;return{x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k,dx:p[i].x-p[i-1].x}}target-=seg}const l=p[p.length-1];return{x:l.x,y:l.y,dx:1}}
function travel(dest,mode){
  if(busy||dest===S.loc)return;const t=tripInfo(dest);const blk=modeBlock(mode,t);if(blk){toast(blk);return}
  if(S.inside)exitScene(true);
  busy=true;renderPanel(true);follow=true;
  const {pts}=route(dest),mins=t[mode].min,fare=t[mode].fare;
  const V=$("vehicle"),W=$("walker");
  if(mode==="walk"){V.style.display="none";W.style.display="";$("avatar").classList.add("walking")}
  else{W.style.display="none";V.style.display="";V.innerHTML=`<g id="vflip">${mode==="keke"?kekeSVG():mode==="okada"?okadaSVG():mode==="bus"?busSVG():horseSVG(true)}</g>`;if(mode==="horse")$("avatar").classList.add("walking")}
  const speed={walk:2.4,keke:1.1,okada:.85,bus:1.2,horse:2}[mode];
  const ms=reduce()?400:Math.min(9000,900+t.d*speed),t0=performance.now();let done=0;
  function step(now){const p=Math.min(1,(now-t0)/ms);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;const pos=at(pts,e);setAv(pos.x,pos.y);
    const vf=$("vflip");if(vf)vf.setAttribute("transform",pos.dx<0?"scale(-1,1)":"");
    if(follow){cam.x+=(pos.x-cam.x)*.12;cam.y+=(pos.y-40-cam.y)*.12;applyCam()}
    const target=Math.round(mins*p);if(target>done){advance(target-done);done=target;renderHud()}
    if(p<1){requestAnimationFrame(step);return}
    W.style.display="";V.style.display="none";$("avatar").classList.remove("walking");
    S.money-=fare;if(mode==="walk"){S.n.energy=clamp(S.n.energy-t.d/40);S.n.hygiene=clamp(S.n.hygiene-t.d/60)}
    if(mode==="horse"){apply({fun:10,social:6});S.flags.rode=1}
    S.loc=dest;selected=dest;
    let msg=`You went to ${LOC[dest].name} by ${MODES[mode].label.toLowerCase()}.`;const r=Math.random(),h=hour();
    if(mode==="okada"&&r<.08){apply({hygiene:-15,fun:-5});msg+=" The okada man swerved into a pothole. You're fine, just dusty."}
    else if(mode==="horse"&&r<.5){apply({social:8});msg+=" Children ran after your horse shouting and waving."}
    else if(t.hw&&r<.25){advance(15);msg+=" Police checkpoint on the Malete road added 15 minutes."}
    else if(t.hw&&mode==="bus"&&r<.4){advance(30);msg+=" The korope broke down near Shao. 30 minutes by the roadside."}
    else if(mode==="keke"&&r<.08&&S.money>=100){S.money-=100;msg+=" The keke man had no change, so you dashed him ₦100."}
    else if(r<.16){advance(20);msg+=" Traffic at Challenge added 20 minutes."}
    else if(r<.24&&h>=13&&h<18){apply({hygiene:-15});msg+=" Rain caught you on the way."}
    log(msg);busy=false;follow=false;checkCritical();save();render();setTimeout(()=>{if(!busy&&S.loc===dest)enterScene();flush()},500)}
  requestAnimationFrame(step)}

    <div class="field"><label for="cname">Name</label><input id="cname" maxlength="16" placeholder="e.g. Muiz" autocomplete="off"></div>
    <div class="field"><span class="lbl">Look</span><div class="seg" id="cg"><button data-g="m">Kaftan and fila</button><button data-g="f">Aso-oke and gele</button><button data-g="h">Gown and hijab</button></div></div>
    <div class="field"><span class="lbl">Skin tone</span><div class="seg" id="cs">${SKINS.map(s=>`<button class="swatch" data-v="${s}" style="background:${s}" aria-label="Skin tone"></button>`).join("")}</div></div>
    <div class="field"><span class="lbl">Outfit colour</span><div class="seg" id="cc">${CLOTHS.map(s=>`<button class="swatch" data-v="${s}" style="background:${s}" aria-label="Outfit colour"></button>`).join("")}</div></div>
    <button class="startbtn" id="cgo">${S.char?"Save changes":"Start life in Ilorin"}</button></div></div>`);
  const nm=$("cname");nm.value=c.name||"";
  function upd(){$("cprev").innerHTML=avatarSVG(c);document.querySelectorAll("#cg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===c.g));document.querySelectorAll("#cs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===c.skin));document.querySelectorAll("#cc button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===c.cloth))}
  $("cg").onclick=e=>{const b=e.target.closest("button");if(b){c.g=b.dataset.g;upd()}};$("cs").onclick=e=>{const b=e.target.closest("button");if(b){c.skin=b.dataset.v;upd()}};$("cc").onclick=e=>{const b=e.target.closest("button");if(b){c.cloth=b.dataset.v;upd()}};
  $("cgo").onclick=()=>{c.name=(nm.value||"").trim()||(c.g==="m"?"Tunji":"Aduke");const first=!S.char;S.char=c;refreshAvatar();closeModal();
    if(first){log(c.name+" moved into a Tanke compound with ₦20,000 and big dreams.");note("Welcome to Ilorin, "+c.name,"Drag to move around the map, pinch or scroll to zoom. Tap a place, then pick how to get there: walk, keke, okada, korope bus, or a Durbar horse if you hire one. Keep your needs up, get a job at the Secretariat, move into an estate, and one day ride the long road to KWASU in Malete.",[{label:"Let's go",fn:()=>{}}])}
    save();render();setTimeout(flush,150)};upd();nm.focus()}
$("me").addEventListener("click",()=>{if(!busy)creator()});$("me").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!busy)creator()}});
$("pause").addEventListener("click",()=>{paused=!paused;$("pause").textContent=paused?"Play":"Pause"});
$("reset").addEventListener("click",()=>{pending.unshift({title:"Start a new life?",body:"Your money, friends and progress will be wiped.",choices:[{label:"Yes, start again",fn:()=>{S=fresh();selected="home";if(!$("scene").style.display)exitScene(true);const p=standPos("home");setAv(p.x,p.y);centerOn(p.x,p.y-30,false);refreshAvatar();setTimeout(creator,200)}},{label:"Cancel",fn:()=>{}}]});flush()});

/* ================= BOOT ================= */
drawMap();initTraffic();requestAnimationFrame(tickTraffic);
const p0=standPos(S.loc);setAv(p0.x,p0.y);cam.w=1000;centerOn(p0.x,p0.y-30,false);refreshAvatar();
if(S.inside){$("map").style.display="none";$("zoombar").hidden=true;$("scene").style.display="";$("scenebar").hidden=false;renderScene()}
render();if(!S.char)creator();else flush();
setInterval(()=>{if(paused||busy||modalOpen||document.hidden)return;advance(2);checkCritical();renderHud();renderPanel();if(S.t%30===0){renderSide();save()}flush()},1000);
setInterval(save,5000);
})();

</script>
</body>
</html>
