<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naija Votes 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E6D6B8; --panel:#FBF4E6; --panel-2:#F1E4CB; --ink:#1F2A4D; --ink-soft:#5E6582; --line:#D8C49E;
  --indigo:#26355E; --laterite:#B5532E; --keke:#F2B705; --leaf:#3F6B3A; --danger:#B3261E; --ok:#2F7D5B; --up:#2F7D5B;
  --sign:"Lilita One","Arial Black",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#111830; --panel:#1B2443; --panel-2:#232E55; --ink:#F1E8D4; --ink-soft:#A9AFC7; --line:#33406B; --indigo:#0F1730; --up:#7FD3A8; --leaf:#8BC57A; }
}
:root[data-theme="dark"]{ --page:#111830; --panel:#1B2443; --panel-2:#232E55; --ink:#F1E8D4; --ink-soft:#A9AFC7; --line:#33406B; --indigo:#0F1730; --up:#7FD3A8; --leaf:#8BC57A; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.loc:focus-visible{outline:3px solid var(--keke);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;max-width:1360px;margin:0 auto;padding:16px}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--sign);font-size:28px;line-height:1;background:var(--indigo);color:#F7E7C1;padding:8px 14px 9px;border-radius:6px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--laterite);letter-spacing:.5px}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700}
.me svg{width:34px;height:34px;border-radius:50%;background:#E9D5AE;display:block}
.hud .spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap}
.pill small{font-weight:500;color:var(--ink-soft)}
.pill.money{color:var(--leaf)}
.pill.nepa{background:#3B2A1A;color:#FFD66B;border-color:#3B2A1A}
.btn{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink-soft)}

.map{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--indigo);background:#D9BF8C;box-shadow:0 10px 0 -4px rgba(38,53,94,.25)}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.loc{cursor:pointer}
.loc:hover .signbg{fill:#3A4C80}
.sel-ring{fill:none;stroke:var(--keke);stroke-width:4;stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.walking .leg-a{animation:legA .32s ease-in-out infinite alternate}
.walking .leg-b{animation:legB .32s ease-in-out infinite alternate}
.walking .arm-a{animation:legB .32s ease-in-out infinite alternate}
.walking .arm-b{animation:legA .32s ease-in-out infinite alternate}
.leg-a,.leg-b,.arm-a,.arm-b{transform-box:fill-box;transform-origin:50% 0}
@keyframes legA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes legB{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
.cloud{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1220px)}}
@media (prefers-reduced-motion: reduce){.sel-ring,.cloud,.walking .leg-a,.walking .leg-b,.walking .arm-a,.walking .arm-b{animation:none}}

.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-family:var(--sign);font-weight:400;font-size:20px;margin:0 0 8px;line-height:1.1}
.muted{color:var(--ink-soft)}

.need{display:grid;grid-template-columns:72px 1fr 36px;align-items:center;gap:10px;margin:7px 0}
.need span{font-weight:600;font-size:14px}
.need b{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.track{height:14px;border-radius:4px;background:var(--panel-2);overflow:hidden;border:1.5px solid var(--line)}
.fill{height:100%;transition:width .4s ease}
.need.low .track{border-color:var(--danger)}
.need.low b{color:var(--danger)}
.f-food{background:repeating-linear-gradient(90deg,#B5532E 0 8px,#E0884F 8px 11px,#7A2E1B 11px 14px)}
.f-energy{background:repeating-linear-gradient(90deg,#E0A800 0 8px,#F7D35C 8px 11px,#9A6B00 11px 14px)}
.f-fun{background:repeating-linear-gradient(90deg,#8C2F5A 0 8px,#C2578A 8px 11px,#5A1838 11px 14px)}
.f-social{background:repeating-linear-gradient(90deg,#26355E 0 8px,#4F6AAE 8px 11px,#121B36 11px 14px)}
.f-hygiene{background:repeating-linear-gradient(90deg,#2F7D7A 0 8px,#5FB3AE 8px 11px,#1A4C4A 11px 14px)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--panel-2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}

.place-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.open{font-size:12.5px;font-weight:600;white-space:nowrap}
.open.no{color:var(--danger)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.act{display:block;width:100%;text-align:left;background:var(--panel-2);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer}
.act:hover:not(:disabled){border-color:var(--indigo)}
.act:disabled{opacity:.55;cursor:not-allowed}
.act-name{font-weight:700;display:block}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;font-weight:600;background:var(--panel);border-radius:6px;padding:1px 7px;color:var(--ink-soft)}
.chip.cost{color:var(--danger)}
.chip.earn,.chip.up{color:var(--up)}
.why{display:block;font-size:12.5px;color:var(--danger);margin-top:4px;font-weight:600}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gobtn{border:none;border-radius:10px;padding:12px;cursor:pointer;font-weight:700;text-align:left}
.gobtn small{display:block;font-weight:500;opacity:.85}
.gobtn.keke{background:var(--keke);color:#2A2000}
.gobtn.walk{background:#26355E;color:#F7E7C1}
.gobtn:disabled{opacity:.5;cursor:not-allowed}
.preview{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.preview li{font-size:12.5px;background:var(--panel-2);border-radius:6px;padding:2px 8px}

.friend{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.friend:last-child{border-bottom:none}
.friend b{display:block}
.friend small{color:var(--ink-soft)}
.hearts{color:#C2578A;letter-spacing:1px;font-size:14px;white-space:nowrap}
.hearts i{font-style:normal;color:var(--line)}

.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:none}
.log time{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.foot{display:flex;justify-content:flex-end}

.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;overflow:auto}
.overlay.on{display:flex}
.modal{background:var(--panel);color:var(--ink);border-radius:16px;max-width:440px;width:100%;padding:20px;border:3px solid #26355E;box-shadow:6px 6px 0 var(--laterite)}
.modal h3{font-family:var(--sign);font-weight:400;font-size:24px;margin:0 0 8px;line-height:1.1}
.modal p{margin:0 0 16px}
.modal .choices{display:flex;flex-direction:column;gap:8px}
.modal .choices button{border:none;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--panel-2);text-align:left}
.modal .choices button:first-child{background:#26355E;color:#F7E7C1}

.creator{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:start}
.creator .stage{background:linear-gradient(#F3E4C4,#E2C893);border-radius:12px;display:flex;justify-content:center;padding:8px 0;border:2px solid #26355E}
.creator .stage svg{width:110px;height:160px}
.field{margin-bottom:12px}
.field label,.field .lbl{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.field input{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:#26355E;color:#F7E7C1;border-color:#26355E}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--keke);outline-offset:2px}
.startbtn{width:100%;border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;background:var(--keke);color:#2A2000;margin-top:4px}
@media (max-width:520px){.creator{grid-template-columns:1fr}.creator .stage svg{height:140px}}

.scenebar{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px}
.scenebar .btn{background:#26355E;color:#F7E7C1;border-color:#26355E}
.scenetitle{font-family:var(--sign);font-size:20px;color:#F7E7C1;background:rgba(38,53,94,.85);padding:4px 12px;border-radius:8px}
.prop{cursor:pointer}.prop:hover .tag rect{fill:#3A4C80}.prop:focus-visible{outline:3px solid var(--keke)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#26355E;color:#F7E7C1;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .app{grid-template-columns:1fr;padding:10px;gap:10px}
  .brand{font-size:22px}
  .map{border-radius:12px}
}

.map{aspect-ratio:10/7;touch-action:none}
.map svg{width:100%;height:100%;cursor:grab}
.map svg:active{cursor:grabbing}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:40px;height:40px;border-radius:10px;border:2px solid #26355E;background:#FBF4E6;color:#26355E;font-weight:800;font-size:18px;cursor:pointer}
.zoombar button.me-btn{font-size:12px}
.go.one{grid-template-columns:1fr}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mode{border:none;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:700}
.mode small{display:block;font-weight:500;font-size:12.5px;opacity:.9}
.mode .mnote{opacity:.75;font-size:11.5px}
.mode:disabled{opacity:.45;cursor:not-allowed}
.m-walk{background:#26355E;color:#F7E7C1}.m-keke{background:#F2B705;color:#2A2000}.m-okada{background:#B3261E;color:#fff}.m-bus{background:#2F7D5B;color:#fff}.m-horse{background:#8C2F5A;color:#fff;grid-column:1/-1}
.goals{list-style:none;margin:0;padding:0;font-size:14px}
.goals li{padding:5px 0;border-bottom:1px solid var(--line)}.goals li:last-child{border-bottom:none}
.goals li.done{color:var(--up);font-weight:700}
.scenebar{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px}
.scenebar .btn{background:#26355E;color:#F7E7C1;border-color:#26355E}
.scenetitle{font-family:var(--sign);font-size:20px;color:#F7E7C1;background:rgba(38,53,94,.85);padding:4px 12px;border-radius:8px}
.prop{cursor:pointer}.prop:hover .tag rect{fill:#3A4C80}
.brand{background:#0E5A3A;box-shadow:3px 3px 0 #5B2A86}
.pill.cd{background:#5B2A86;color:#F3EEDF;border-color:#5B2A86}
.langsel{border-radius:999px;border:1.5px solid var(--line);background:var(--panel);padding:6px 10px;font-weight:600}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px}
#tabs button{border:none;background:none;border-radius:10px;padding:9px 4px;font-weight:800;cursor:pointer;font-size:14px}
#tabs button[aria-current="page"]{background:#0E5A3A;color:#F3EEDF}
.who{font-size:13.5px;margin:0 0 6px}
.badge{border:2px solid currentColor;border-radius:6px;padding:0 6px;font-weight:800;font-size:11.5px;text-transform:uppercase}
.badge.poor,.stamp.poor{color:#A8322B}.badge.middle,.stamp.middle{color:#C9962B}.badge.rich,.stamp.rich{color:#0E5A3A}
.stamp{display:inline-block;border:4px solid currentColor;border-radius:8px;padding:2px 12px;font-family:var(--sign);font-size:28px;transform:rotate(-4deg);margin:0 0 12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:0 0 10px}.facts dt{font-size:12px;font-weight:700;color:var(--ink-soft)}.facts dd{margin:0;font-weight:600}
.vibe{font-weight:700;color:#0E5A3A}
.pvc{list-style:none;display:flex;gap:6px;padding:0;margin:10px 0;counter-reset:s}.pvc li{flex:1;counter-increment:s;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:13px;font-weight:700}
.pvc li::before{content:counter(s);display:block;font-family:var(--sign);font-size:18px;color:var(--ink-soft)}.pvc li.done{border-color:#0E5A3A}.pvc li.done::before{content:"✓";color:#0E5A3A}
.sched{list-style:none;padding:0;margin:8px 0;font-size:13.5px}.sched li{padding:5px 0;border-bottom:1px solid var(--line)}.sched b{display:inline-block;min-width:56px}
.warn{color:#A8322B;font-weight:700}
.form label{display:block;font-weight:700;font-size:13.5px;margin-bottom:10px}.form input,.form select,.field select{display:block;width:100%;margin-top:5px;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel-2)}
.lbl{font-weight:700;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.chips .chip{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--panel-2);color:var(--ink)}
.feed{list-style:none;margin:12px 0 0;padding:0}.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.feed.small li{font-size:13px}
.pchip{flex:none;color:#fff;font-family:var(--sign);border-radius:6px;padding:2px 6px;height:fit-content;min-width:44px;text-align:center}
.tvscreen{background:#0B120D;color:#F3EEDF;border-radius:12px;padding:16px;border:6px solid #2A2F2A;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.chan{font-family:var(--sign);letter-spacing:1px}.live{background:#A8322B;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;margin-left:6px;font-family:var(--ui);font-weight:800}
.headline{font-weight:800;font-size:19px;line-height:1.25;margin:0}.ad{font-size:12.5px;background:#1E2A21;border-radius:6px;padding:6px 8px;color:#C9D6CB}
.slots{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px}
.papers{list-style:none;padding:0;margin:0 0 12px}.papers li{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:6px;background:#FFFDF6;color:#222}.papers b{display:block;font-family:Georgia,serif}
.pad{width:120px;height:120px;border-radius:24px;border:3px solid #0E5A3A;background:#E3EFE6;font-size:46px;cursor:pointer;margin:12px auto;display:grid;place-items:center}
.ballot{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0 14px;max-height:52vh;overflow:auto}
.pbox{display:grid;grid-template-columns:1fr 40px;gap:2px 8px;text-align:left;border:1.5px solid #DCD3BC;background:#FFFDF6;color:#16201A;border-radius:10px;padding:8px;cursor:pointer}
.pbox b{font-family:var(--sign);font-size:20px;border-left:5px solid;padding-left:8px;font-weight:400}.pbox small{grid-column:1;font-size:11.5px;color:#5C6458}
.thumbslot{grid-column:2;grid-row:1/3;border:1.5px dashed #BFB59A;border-radius:8px;display:grid;place-items:center}.pbox.sel{border-color:#5B2A86;box-shadow:0 0 0 2px #5B2A86}.print{width:20px;height:26px;border-radius:10px;background:#5B2A86}
.disclaimer{background:#E3EFE6;color:#16201A;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.bar{display:grid;grid-template-columns:52px 1fr 116px;gap:8px;align-items:center;margin:6px 0}.bl{font-family:var(--sign)}.bt{height:14px;background:var(--panel-2);border-radius:4px;overflow:hidden}.bf{display:block;height:100%;transition:width .4s}.bv{font-weight:700;font-size:13px;text-align:right}
.nmap{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,34px);gap:3px;margin:12px 0}.tile{border-radius:5px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;line-height:1.05}.tile b{font-size:10px}.tile.mine{outline:3px solid var(--ink)}
.h3{font-family:var(--sign);font-weight:400;font-size:18px;margin:8px 0}
#mypu table{border-collapse:collapse;width:100%}#mypu td{padding:4px 6px;border-bottom:1px solid var(--line)}
.modal.wide{max-width:640px;max-height:90vh;overflow:auto}
.modes{grid-template-columns:1fr 1fr}.m-danfo{background:#F2B705;color:#2A2000}.m-ride{background:#2B6CB0;color:#fff}.m-suv{background:#1F1F1F;color:#fff}
.creator .field select{margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="hud">
      <div class="brand">Naija Votes 27</div>
      <div class="me" id="me" role="button" tabindex="0" aria-label="Your character"></div>
      <div class="spacer"></div>
      <div class="pill cd" id="countdown"></div>
      <div class="pill" id="clock"></div>
      <div class="pill money" id="money"></div>
      <div class="pill" id="mood"></div>
      <div class="pill nepa" id="nepa" hidden>No light</div>
      <select class="langsel" id="langsel" aria-label="Language"></select>
      <button class="btn" id="pause">Pause</button>
    </div>
    <p class="muted small" id="statevibe" style="margin:0"></p>
    <div class="map">
      <svg id="map" role="img" aria-label="Map of your local government area"></svg>
      <svg id="scene" viewBox="0 0 1000 700" role="img" aria-label="Inside view" style="display:none"></svg>
      <div class="zoombar" id="zoombar"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zme" class="me-btn" aria-label="Find me">Me</button></div>
      <div class="scenebar" id="scenebar" hidden><button class="btn" id="exitbtn">Back to map</button><span class="scenetitle" id="scenetitle"></span></div>
    </div>
  </div>
  <div class="side">
    <section class="card" aria-label="Needs"><p class="who" id="who"></p><div id="needs"></div></section>
    <nav id="tabs" aria-label="Panels"><button data-t="life">Life</button><button data-t="campaign">Campaign</button><button data-t="election">Election</button></nav>
    <section class="card" id="place" aria-live="polite"></section>
    <div id="tabbody" hidden></div>
    <section class="card"><h2>Diary</h2><ul class="log" id="log"></ul></section>
    <div class="foot"><button class="btn" id="reset">Start a new life (dev)</button></div>
    <p class="muted small">A game. Not affiliated with INEC or any party, and not a poll or prediction.</p>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="ovm" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt"></h3><div id="mbody"></div></div></div>

const ADJ2={};EDGES.forEach(([a,b])=>{(ADJ2[a]=ADJ2[a]||[]).push(b);(ADJ2[b]=ADJ2[b]||[]).push(a)});
function shortest(from,to){const dist={},prev={},Q=new Set(nodes.map(n=>n.id));Q.forEach(n=>dist[n]=Infinity);dist[from]=0;
  while(Q.size){let u=null;Q.forEach(n=>{if(u===null||dist[n]<dist[u])u=n});Q.delete(u);if(u===to||dist[u]===Infinity)break;(ADJ2[u]||[]).forEach(v=>{if(!Q.has(v))return;const p=np(u),q=np(v);const alt=dist[u]+Math.hypot(q.x-p.x,q.y-p.y);if(alt<dist[v]){dist[v]=alt;prev[v]=u}})}

function routeLen(p){let d=0;for(let i=1;i<p.length;i++)d+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return d}
const MSPEC={walk:{label:"Walk",min:d=>Math.round(d/6),fare:()=>0},okada:{label:"Okada",min:d=>Math.round(3+d/40),fare:d=>100+Math.round(d/300)*50},danfo:{label:"Danfo bus",min:d=>Math.round(10+d/30),fare:d=>150+Math.round(d/500)*50},keke:{label:"Keke",min:d=>Math.round(4+d/32),fare:d=>150+Math.round(d/250)*50},ride:{label:"Ride-hailing",min:d=>Math.round(3+d/45),fare:d=>900+Math.round(d/100)*100},suv:{label:"Your SUV",min:d=>Math.round(3+d/45),fare:()=>0}};
const modeList=()=>["walk",...MODES[S.c.cls].map(m=>m[0]).filter(k=>k!=="walk")];
function at(p,f){const total=routeLen(p);let target=total*f;for(let i=1;i<p.length;i++){const seg=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);if(target<=seg){const k=seg?target/seg:0;return{x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k,dx:p[i].x-p[i-1].x}}target-=seg}const l=p[p.length-1];return{x:l.x,y:l.y,dx:1}}
function travel(dest,mode){if(busy||dest===S.c.pos)return;const c=S.c,pts=route(dest),d=routeLen(pts),M=MSPEC[mode],fare=M.fare(d);if(fare>c.money){toast("Not enough money. You can walk.");return}

    if(p<1){requestAnimationFrame(step);return}
    Wk.style.display="";V.style.display="none";$("avatar").classList.remove("walking");bubble(null);c.money-=fare;if(mode==="walk")apply({energy:-d/50,hygiene:-d/70});

    if(dest!=="home"&&Math.random()<.4){S.informed++;const src=pick(["From a roadside radio","A newspaper vendor shouts","At the bus stop, someone reads aloud"]);msg+=` ${src}: "${curNews()}"`;toast(src+": "+curNews())}

/* ================= VOTE BUYING (risky, unverifiable, punished) ================= */
function openBribe(){const c=S.c;const amts=[1000,5000,10000],groups=[5,20,50];let a=1,g=0,party=0;
  const draw=()=>{const total=amts[a]*groups[g],risk=Math.min(85,Math.round((.12+groups[g]*.006+amts[a]/200000)*100));
    openModal("Offer money for votes",`<p class="warn">Vote buying is a crime under the Electoral Act. If you are caught you lose the money, pay a fine, lose your PVC and spend time in custody. Ballots are secret, so you can never check how anyone voted.</p>
    <div class="form"><label>For which party<select id="bp">${PARTIES.map((p,i)=>`<option value="${i}" ${i===party?"selected":""}>${p[0]}, ${esc(p[1])}</option>`).join("")}</select></label>
    <div class="lbl">Money per person</div><div class="seg" id="ba">${amts.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===a}">${naira(x)}</button>`).join("")}</div>
    <div class="lbl" style="margin-top:10px">How many people</div><div class="seg" id="bg">${groups.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===g}">${x}</button>`).join("")}</div></div>
    <p><b>Total ${naira(total)}</b>. Chance of getting caught: about ${risk}%.</p>
    <div class="choices"><button data-go="1" ${total>c.money?"disabled":""}>${total>c.money?"Not enough money":"Share the money"}</button><button data-x="1">Walk away</button></div>`,true);
    $("bp").onchange=e=>party=+e.target.value;
    $("ba").onclick=e=>{const b=e.target.closest("button");if(b){a=+b.dataset.i;draw()}};$("bg").onclick=e=>{const b=e.target.closest("button");if(b){g=+b.dataset.i;draw()}};
    $("mbody").onclick=async e=>{if(e.target.closest("[data-x]")){closeModal();log("You thought about buying votes, then walked away.");save();return}
      const go=e.target.closest("[data-go]");if(!go||go.disabled)return;closeModal();busy=true;bubble("Sharing money");await runClock(60);bubble(null);busy=false;
      const n=groups[g],per=amts[a],tot=per*n;c.money-=tot;
      if(Math.random()*100<risk){const fine=Math.min(c.money,Math.round(c.money*.5));c.money-=fine;c.pvc=c.pvc==="none"?"none":"flagged";c.flagged=c.pvc==="flagged";S.civic=Math.max(0,S.civic-5);S.flags.jail=1;advance(720);
        S.promos.push({kind:"news",party:-2,day:dayNum(),by:"NVT News",label:`Vote buyer arrested in ${LGA}. EFCC says investigations continue`});
        log(`You were arrested for vote buying. You lost ${naira(tot)}, paid a ${naira(fine)} fine and spent the night in custody.`);note("Arrested","Someone you tried to pay reported you. Police arrested you in the act. Your money is gone, you paid a fine, your PVC was seized and you spent the night in a cell. You are out on bail.")}
      else{let took=0,really=0;for(let i=0;i<n;i++){if(Math.random()<.6){took++;if(Math.random()<.5)really++}}
        S.bribed=S.bribed||{};S.bribed[party]=(S.bribed[party]||0)+really;
        log(`${took} of ${n} people took your ${naira(per)}. The ballot is secret, so you will never know how they voted.`);toast(`${took} took the money. ${n-took} refused.`)}
      save();render()}};
  draw()}

function chipsFor(a){let ch=[`<span class="chip">${a.dur>=60?(a.dur/60).toFixed(a.dur%60?1:0)+" hr":a.dur+" min"}</span>`];if(cost(a))ch.push(`<span class="chip cost">${naira(cost(a))}</span>`);for(const k in a.fx){const v=a.fx[k];ch.push(`<span class="chip ${v>0?"up":"cost"}">${v>0?"+":"−"}${SHORT[k]}</span>`)}if(a.media||a.informed||a.overhear)ch.push(`<span class="chip up">+Informed</span>`);return ch.join("")}
function renderPanel(force){if(S.tab!=="life"){return}const L=LOC[selected],open=isOpen(L,hour());let html=`<div class="place-head"><h2>${esc(L.name)}</h2><span class="open${open?"":" no"}">${open?openText(L):"Closed now"}</span></div><div class="muted">${esc(L.blurb)}</div>`;
  if(selected===S.c.pos){html+=S.inside?`<div class="go one"><button class="gobtn walk" data-out="1" ${busy?"disabled":""}>Go outside<small>Back to the map</small></button></div>`:`<div class="go one"><button class="gobtn keke" data-in="1" ${busy?"disabled":""}>Go inside<small>Walk into ${esc(L.name)}</small></button></div>`;
    html+=`<div class="acts">${ACT[selected].map((a,i)=>{const why=busy?"":reason(a);return `<button class="act" data-act="${i}" ${why||busy?"disabled":""}><span class="act-name">${esc(a.label)}</span><span class="chips">${chipsFor(a)}</span>${why?`<span class="why">${esc(why)}</span>`:""}</button>`}).join("")}</div>`}
  else{const d=routeLen(route(selected));html+=`<div class="modes">${modeList().map(k=>{const M=MSPEC[k],f=M.fare(d),m=M.min(d);const b=busy||f>S.c.money;return `<button class="mode m-${k}" data-go="${k}" ${b?"disabled":""}><b>${M.label}</b><small>${f?naira(f):"Free"}, about ${m} min</small></button>`}).join("")}</div><ul class="preview">${ACT[selected].map(a=>`<li>${esc(a.label)}</li>`).join("")}</ul>`}
  const key=html+busy;if(!force&&key===lastPanel)return;lastPanel=key;$("place").innerHTML=html}
$("place").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.act!==undefined)doActionHere(ACT[S.c.pos][+b.dataset.act]);else if(b.dataset.go)travel(selected,b.dataset.go);else if(b.dataset.in)enterScene();else if(b.dataset.out)exitScene()});
function renderTabs(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===S.tab?"page":"false"));
  if(S.tab==="life"){$("place").hidden=false;$("tabbody").hidden=true;lastPanel="";renderPanel(true)}
  else{$("place").hidden=true;$("tabbody").hidden=false;$("tabbody").innerHTML=S.tab==="campaign"?campaignHTML():electionHTML();if(S.tab==="campaign")wireCampaign();else{const r=$("results");if(r)r.onclick=openResults}}}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();renderTabs()});
function renderSide(){$("log").innerHTML=S.log.slice(0,6).map(e=>`<li><time>Day ${Math.floor(e.t/1440)+1}, ${fmtT(e.t)}</time>${esc(e.m)}</li>`).join("");
  const c=S.c;$("who").innerHTML=`<span class="badge ${c.cls}">${CL[c.cls]}</span> ${esc(c.job)}. ${esc(c.home)}. <span class="muted">${esc(LGA)}, ${esc(ST[0])}. ${esc(B.name)}.</span>`}
function render(){if(S.inside&&sceneLoc!==S.c.pos)renderScene();renderHud();renderTabs();renderRings();renderSide()}
function openModal(title,html,wide){modalOpen=true;$("mt").textContent=title;$("mbody").innerHTML=html;$("ovm").classList.toggle("wide",!!wide);$("overlay").classList.add("on")}
function closeModal(){$("overlay").classList.remove("on");modalOpen=false;setTimeout(flush,150)}
function flush(){if(modalOpen||busy||!pending.length)return;const m=pending.shift();const ch=m.choices||[{label:"Okay",fn:()=>{}}];
  openModal(m.title,`${m.html?m.body:"<p></p>"}<div class="choices">${ch.map((x,i)=>`<button data-i="${i}">${esc(x.label)}</button>`).join("")}</div>`,m.html);if(!m.html)$("mbody").querySelector("p").textContent=m.body;
  $("mbody").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;closeModal();ch[+b.dataset.i].fn();checkCritical();save();render()}}

/* ================= CREATE ================= */
function creator(){const look={g:"m",skin:SKINS[0],cloth:CLOTHS[0]};
  openModal("Create your citizen",`<div class="creator"><div class="stage"><svg viewBox="-30 -75 60 85" aria-hidden="true"><g id="cprev"></g></svg></div><div>
   <div class="field"><label for="cname">Name</label><input id="cname" maxlength="16" autocomplete="off" placeholder="e.g. Muiz"></div>
   <div class="field"><label for="cst">State</label><select id="cst">${STATES.map((s,i)=>`<option value="${i}" ${i===23?"selected":""}>${s[0]}</option>`).join("")}</select></div>
   <div class="field"><label for="clg">Local government</label><select id="clg"></select></div>
   <div class="field"><span class="lbl">Look</span><div class="seg" id="cg"><button data-g="m">Kaftan and fila</button><button data-g="f">Aso-oke and gele</button><button data-g="h">Gown and hijab</button></div></div>
   <div class="field"><span class="lbl">Skin tone</span><div class="seg" id="cs">${SKINS.map(s=>`<button class="swatch" data-v="${s}" style="background:${s}" aria-label="Skin tone"></button>`).join("")}</div></div>
   <div class="field"><span class="lbl">Outfit</span><div class="seg" id="cc">${CLOTHS.map(s=>`<button class="swatch" data-v="${s}" style="background:${s}" aria-label="Outfit colour"></button>`).join("")}</div></div>
   <p class="muted small">Your class, job, home and money are rolled once and saved for good.</p><button class="startbtn" id="cgo">Roll my life</button></div></div>`,true);
  const fill=()=>{$("clg").innerHTML=STATES[+$("cst").value][4].map((l,i)=>`<option value="${i}">${l}</option>`).join("")};$("cst").onchange=fill;fill();
  const upd=()=>{$("cprev").innerHTML=avatarSVG(look);document.querySelectorAll("#cg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===look.g));document.querySelectorAll("#cs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===look.skin));document.querySelectorAll("#cc button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===look.cloth))};
  $("cg").onclick=e=>{const b=e.target.closest("button");if(b){look.g=b.dataset.g;upd()}};$("cs").onclick=e=>{const b=e.target.closest("button");if(b){look.skin=b.dataset.v;upd()}};$("cc").onclick=e=>{const b=e.target.closest("button");if(b){look.cloth=b.dataset.v;upd()}};upd();
  $("cgo").onclick=()=>{const name=($("cname").value||"").trim();if(!name){toast("Enter your name");return}const si=+$("cst").value,li=+$("clg").value;
    const r=Math.random(),cls=r<.63?"poor":r<.95?"middle":"rich",under=cls==="poor"&&Math.random()<.15,p=Math.random();
    S.char={name,...look};S.c={name,si,li,pi:Math.floor(Math.random()*3),cls,job:pick(JOBS[cls]),home:under?"Under a flyover near the motor park":pick(HOMES[cls]),under,money:Math.round(rnd(...START[cls])),pvc:p<.55?"have":p<.8?"registered":"none",regDay:-1,pos:"home",
      tv:cls==="rich"||(cls==="middle"&&Math.random()<.85)||(cls==="poor"&&!under&&Math.random()<.2),radio:cls!=="poor"?Math.random()<.7:Math.random()<(under?.3:.6)};
    S.lang=STATES[si][3];S.t=7*60;S.log=[];log(`${name} started life in ${STATES[si][4][li]}, ${STATES[si][0]}.`);S.flags.reveal=1;save();location.reload()}}
function reveal(){const c=S.c;S.flags.reveal=0;save();openModal("Your life",`<div class="stamp ${c.cls}">${CL[c.cls]}</div><dl class="facts"><div><dt>Job</dt><dd>${esc(c.job)}</dd></div><div><dt>Home</dt><dd>${esc(c.home)}</dd></div><div><dt>Money</dt><dd>${naira(c.money)}</dd></div><div><dt>PVC</dt><dd>${c.pvc==="have"?"You have it":c.pvc==="registered"?"Registered, never collected":"Not registered"}</dd></div><div><dt>TV at home</dt><dd>${c.tv?"Yes":"No"}</dd></div><div><dt>Radio</dt><dd>${c.radio?"Yes":"No"}</dd></div></dl>
  <p class="vibe">${esc(LGA)}, ${esc(ST[0])}: ${esc(ST[2])}. ${esc(B.name)}.</p><p class="muted small">Election day is day ${ELECTION_DAY}. Drag the map, tap places, and live your life on the way to the ballot.</p><div class="choices"><button data-x="1">Start</button></div>`,true);$("mbody").onclick=e=>{if(e.target.closest("[data-x]"))closeModal()}}

/* ================= BOOT ================= */
$("langsel").innerHTML=LANGS.map(([k,n])=>`<option value="${k}" ${k===S.lang?"selected":""}>${n}</option>`).join("");$("langsel").onchange=e=>{S.lang=e.target.value;save()};
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"Play":"Pause"};
$("reset").onclick=()=>{openModal("Start a new life?","<p>This wipes your citizen. In the real game, lives are permanent.</p><div class='choices'><button data-y='1'>Wipe and restart</button><button data-x='1'>Cancel</button></div>");$("mbody").onclick=e=>{if(e.target.closest("[data-y]")){localStorage.removeItem(KEY);location.reload()}if(e.target.closest("[data-x]"))closeModal()}};
drawMap();
if(!S.c){$("statevibe").textContent="36 states and the FCT";creator()}else{
  Object.defineProperty(S,"loc",{get(){return S.c.pos},enumerable:false});
  $("statevibe").textContent=`${LGA}, ${ST[0]}: ${ST[2]}`;
  initTraffic();requestAnimationFrame(tickTraffic);const p0=standPos(S.c.pos);setAv(p0.x,p0.y);cam.w=1100;centerOn(p0.x,p0.y-30,false);refreshAvatar();
  if(S.inside){$("map").style.display="none";$("zoombar").hidden=true;$("scene").style.display="";$("scenebar").hidden=false;renderScene()}
  render();if(S.flags.reveal)reveal();else flush();
  setInterval(()=>{if(paused||busy||modalOpen||document.hidden)return;advance(2);checkCritical();renderHud();if(S.tab==="life")renderPanel();if(S.t%30===0){renderSide();save()}flush()},1000);setInterval(save,5000)}
})();

</script>
</body>
</html>
